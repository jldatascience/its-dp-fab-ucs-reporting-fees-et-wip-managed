# CICD/deployment/parameter.yml — its-dp-fab-ucs-reporting-fees-et-wip-managed (UCS Reporting Fees & WIP)
# AUCUNE RÈGLE au 31/10/2026 : fabric/ ne contient aucun item. Ce fichier n'est pas encore
# référencé par config.yml (clé core.parameter absente) ; l'y ajouter avec la première règle.
# Les 56 règles du Framework ne s'appliquent pas à UCS et ne sont pas reprises.
#
# Une seule famille de règles est admise pour UCS, au format fabric-cicd 1.4.0 (key_value_replace) :
#   Workspace courant (UCS) — item du même dépôt, appelé par une activité InvokePipeline ou
#   TridentNotebook (une règle pour le workspace, une pour l'item) :
#     - find_key: $.properties.activities[?(@.name=="<activité>")].typeProperties.workspaceId
#       replace_value: {_ALL_: "$workspace.$id"}
#       item_type: DataPipeline
#       item_name: <pipeline appelant>
#     - find_key: $.properties.activities[?(@.name=="<activité>")].typeProperties.pipelineId
#       replace_value: {_ALL_: "$items.DataPipeline.<pipeline appelé>.$id"}
#       item_type: DataPipeline
#       item_name: <pipeline appelant>
#   (notebookId et $items.Notebook.<nom>.$id pour une activité TridentNotebook.)
#
# Interdit pour UCS (R5) : toute référence résolue AU DÉPLOIEMENT vers un autre workspace,
# Framework compris ($workspace.<autre workspace>…) : DEPS_CROSS_WORKSPACE_FORBIDDEN.
# Une consommation de données d'un autre Data Product se résout à l'exécution (shortcut,
# Variable Library) et se déclare dans data_dependencies de dependencies.yml.
# Interdits également : GUID de workspace sandbox ou d'environnement en dur (GUID_HARDCODED),
# GUID littéral dans replace_value (RULE_LITERAL_GUID), clés d'environnement en minuscules.
#
# Procédure : après synchronisation Git Integration (dossier fabric), lancer depuis
# CICD/ref_dynamique/ les scripts 01 à 04 (proposition de règles hors dépôt), recopier ici les
# règles retenues, puis :
#   python ../its-dp-fab-cicd-common/CICD/tools/deploy.py validate --repo .
# jusqu'à zéro erreur (règle sans effet, GUID non couvert et item absent sont bloquants).
